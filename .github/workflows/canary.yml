name: Voice Service Canary

# Daily smoke test: synthesizes one short, fixed sentence end-to-end so a
# silent breakage (upstream F5-TTS release, a dependency update, an expired
# PAT) is caught before it shows up as a mysteriously failing real job.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check fixture exists
        id: fixture
        run: |
          if [ -f scripts/canary/profile/reference.wav ] && [ -f scripts/canary/profile/reference.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.fixture.outputs.present == 'true'
        run: pip install -r requirements.txt
      - name: Run a tiny fixed test through the real pipeline
        id: test
        if: steps.fixture.outputs.present == 'true'
        run: |
          python scripts/run_shard.py \
            --manifest scripts/canary/manifest.json \
            --shard-index 0 \
            --profile-dir scripts/canary/profile \
            --out-dir canary_out
      - name: Report result
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ steps.fixture.outputs.present }}" != "true" ]; then
            python scripts/notify.py "yt-voice canary: skipped -- no fixture yet at scripts/canary/profile/ (see README Setup step 5)."
          elif [ "${{ steps.test.outcome }}" = "success" ]; then
            python scripts/notify.py "yt-voice canary: OK"
          else
            python scripts/notify.py "yt-voice canary: FAILED -- check the Actions log (an upstream F5-TTS/dependency update may have broken something)"
          fi
